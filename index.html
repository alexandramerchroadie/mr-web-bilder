      {plane('b','rotateY(180deg) translateZ(45px)',[0,0,500,560],500,560,0,0)}
     </div></div></div></div>
  {up&&<button type="button" aria-label="Nach oben" onClick={()=>window.scrollTo({top:0,behavior:'smooth'})} className="lg:hidden fixed right-3 bottom-24 z-40 grid place-items-center w-11 h-11 rounded-full border border-[var(--ac)] bg-[#54384a]/90 text-white shadow-lg"><span style={{display:'inline-block',transform:'rotate(180deg)'}}><I n="dn" s={18}/></span></button>}
  {!prev&&<div className="hidden lg:grid absolute left-5 bottom-3 z-20 grid-cols-1 gap-2 justify-items-center">
   <button onClick={()=>zoomAt(1.4,0,0)} aria-label="Vergrößern" title="Hineinzoomen (oder Mausrad)" className="w-10 h-10 rounded-full border border-[var(--ac)] bg-[#54384a] text-white text-xl leading-none">+</button>
   <button onClick={()=>zoomAt(1/1.4,0,0)} aria-label="Verkleinern" title="Herauszoomen" className="w-10 h-10 rounded-full border border-[var(--ac)] bg-[#54384a] text-white text-xl leading-none">−</button>
   {zv.z>1&&<button onClick={()=>setZv({z:1,x:0,y:0})} title="Zoom zurücksetzen" className="rounded-full border border-[var(--ac)] bg-[#54384a] text-white text-[11px] px-2.5 py-1.5">{Math.round(zv.z*100)}%</button>}</div>}
  {!prev&&<div className="hidden lg:flex absolute left-1/2 -translate-x-1/2 bottom-1 z-20 gap-2"><button onClick={()=>cyc(-1)} aria-label="Vorherige Ansicht" title="Vorherige Ansicht" className="w-10 h-10 rounded-full border border-[var(--ac)] bg-[#54384a] text-white grid place-items-center"><I n="l" s={20}/></button><button onClick={()=>cyc(1)} aria-label="Nächste Ansicht" title="Nächste Ansicht" className="w-10 h-10 rounded-full border border-[var(--ac)] bg-[#54384a] text-white grid place-items-center"><I n="rt" s={20}/></button></div>}
  </div>
  {step>=2&&!prev&&<div className="lg:absolute lg:right-6 lg:top-24 lg:w-[22rem] lg:max-w-[calc(100%-3rem)] mx-4 mb-3 lg:mx-0 lg:mb-0 max-lg:order-last z-10 box-border overflow-hidden rounded-3xl border border-[var(--ac)] bg-[#273055] p-5 text-[15px]">
   <div className="hf text-lg mb-3">Deine Auswahl</div>
   {!pr.length?<div className="text-white/70 mb-3">{noData?"Druckdaten folgen.":"Noch keine Drucke platziert."}</div>:<div className="grid grid-cols-1 gap-3 mb-4">{pr.map(e=>{const u=ups.find(x=>x.id===e.uid),open=pexp[e.id];return <div key={e.id} className="flex items-start gap-3 border-b border-white/10 pb-2 min-w-0"><img src={u.src} alt="" className="w-10 h-10 shrink-0 object-contain rounded-lg bg-white/10"/><div className="min-w-0 flex-1"><button type="button" title={u.name} onClick={()=>setPexp(p=>({...p,[e.id]:!p[e.id]}))} className={"block w-full text-left font-semibold "+(open?"break-words":"truncate")}>{u.name}</button><div className="mt-1 grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 text-sm text-white/70"><span className="break-words">{vLabel(e.view)} · {CL[cls(e)]} · {TECH[e.tech]}</span></div></div></div>})}</div>}
   <div className="border-t border-white/20 pt-3 text-white/70">{qty} Stück{!TIERS.includes(qty)?' · Individualauflage':''}{noSizes?' · Größen folgen':''}</div>
   {els.some(e=>e.tech==='advice')&&<div className="text-xs text-white/60 mt-3">Beratung gewählt: Wir melden uns bei dir.</div>}</div>}
  <div className={"grid gap-3 "+(land?"grid-cols-2 gap-2 p-2 pt-0 [&_button]:!text-[10px] [&_button]:!py-1.5 [&_button]:!px-1 [&_button]:leading-tight":"grid-cols-2 p-4 lg:px-8 lg:pb-8")} style={prev?{visibility:"hidden"}:{}}>{VIEWS.map(([k,l])=><button key={k} onClick={()=>goView(k)} className={"rounded-full border-2 py-2.5 lg:py-3 text-xs sm:text-sm uppercase "+(view===k?'border-[var(--ac)] text-[var(--ac)]':'border-[#1f2749] '+(bg.l?'text-[#1f2749]':'text-white'))}>{l}</button>)}</div>
 </section>

 {pv&&<div className="fixed inset-0 z-[60] bg-black/70 grid place-items-center p-4" onClick={()=>setPv(null)}><div className="bg-white rounded-2xl p-3 max-w-lg" onClick={e=>e.stopPropagation()}><img src={pv.src} className="max-h-[70vh] max-w-full"/><div className="text-xs text-black mt-2 text-center">{pv.name}</div></div></div>}
{cat&&<Catalog onClose={()=>setCat(false)}/>}

{modal&&<div className="fixed inset-0 z-50 bg-black/70 flex justify-center items-start sm:items-center p-3 overflow-y-auto" onClick={()=>setModal(false)}>
  <form onClick={e=>e.stopPropagation()} onSubmit={submitReq} className="w-full max-w-2xl my-auto min-w-0 rounded-3xl border border-[var(--ac)] bg-[#273055] p-5 sm:p-6 grid grid-cols-1 gap-4">
   <div className="flex justify-between items-center"><h3 className="hf text-xl">Deine Anfrage</h3><button type="button" onClick={()=>setModal(false)} aria-label="Schließen"><I n="x"/></button></div>
   {!cartItems.length&&<div className="text-sm text-white/70">Noch nichts zum Anfragen vorhanden. Platziere zuerst mindestens einen Druck.</div>}
   <div className="grid grid-cols-1 gap-3">{cartItems.map(d=>{const c=calcItem(d),nos=d.id==='cur'?noSizes:d.noSizes,open=!!mexp[d.id];return <div key={d.id} className="rounded-2xl border border-white/20 p-4 min-w-0">
    <button type="button" aria-expanded={open} disabled={!d.els.length} onClick={()=>setMexp(p=>({...p,[d.id]:!p[d.id]}))} className={"w-full text-left"+(d.els.length?"":" cursor-default")}><span className="flex items-center gap-2 flex-wrap"><Dot c={d.color}/><b className="hf text-base">{c.mm.name}</b><span className="text-sm text-white/70">· {cname(d.color)}</span>{d.els.length>0&&<span className="ml-auto" style={{display:'inline-block',transform:open?'rotate(180deg)':'none'}}><I n="dn" s={18}/></span>}</span><span className={"block text-xs mt-1 "+(!d.els.length?'text-white/80':'text-[var(--ac)]')}>{!d.els.length?'Noch keine Druckdaten vorhanden':open?'Konfiguration ausblenden':'Antippen, um die Konfiguration zu sehen'}</span></button>
    {d.id==='cur'&&!d.els.length&&helpTxt&&<div className="mt-2 rounded-xl bg-white/5 border border-white/15 p-3"><div className="text-xs text-white/60 mb-1">Deine Nachricht:</div><div className="text-sm whitespace-pre-wrap break-words">{helpTxt}</div></div>}
    {open&&<div className="mt-3 grid grid-cols-2 gap-2">{VIEWS.filter(([k])=>d.els.some(e=>e.view===k)).map(([k,l])=><div key={k} className="rounded-xl bg-[#dfe2e8] p-2 min-w-0"><MiniView m={c.mm} color={d.color} view={k} els={d.els.filter(e=>e.view===k)} ups={ups}/><div className="text-center text-[11px] font-semibold text-[#1f2749] mt-1">{l}</div></div>)}</div>}
    <div className="text-sm text-white/80 mt-1">{d.qty} Stück{!TIERS.includes(d.qty)?' · Individualauflage':''}</div>
    {d.id==='cur'&&!d.els.length&&interest.length>0&&<div className="text-sm text-white/80 mt-1">Interesse an: {interest.map(k=>TECH[k]).join(', ')}</div>}
    <div className="text-sm text-white/70">{nos?'Größenverteilung folgt':szOf(d.mid,d.color).map((z,i)=>d.sizes[i]>0?XL(z)+': '+d.sizes[i]:null).filter(Boolean).join(' · ')}</div>
    <div className="mt-3 grid grid-cols-1 gap-2">{d.els.map(e=>{const u=ups.find(x=>x.id===e.uid)||{name:'Motiv',src:''},cl=c.cl(e);return <button type="button" key={e.id} disabled={!u.src} title="Antippen, um die Datei zu sehen" onClick={()=>setPv(u)} className="flex items-center gap-3 min-w-0 w-full text-left rounded-xl hover:bg-white/5 p-1 -m-1">{u.src&&<img src={u.src} alt="" className="w-10 h-10 shrink-0 object-contain rounded-lg bg-white/10"/>}<div className="min-w-0 flex-1"><div className="truncate text-sm font-semibold" title={u.name}>{u.name}</div><div className="text-xs text-white/70">{vLabel(e.view)} · {cl?CL[cl]:'zu groß'} · {TECH[e.tech]}</div></div></button>})}</div>
    {d.els.some(e=>e.tech==='advice')&&<div className="text-xs text-white/60 mt-2">Für Positionen mit „Beratung gewünscht“ melden wir uns bei dir.</div>}</div>})}</div>
   <div className="border-t border-white/20 pt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
    <label className="grid grid-cols-1 gap-1 text-xs">Name *<input name="name" required type="text" autoComplete="name"/></label>
    <label className="grid grid-cols-1 gap-1 text-xs"><div>Firma <span className="text-white/50">(optional)</span></div><input name="firma" type="text" autoComplete="organization"/></label>
    <label className="sm:col-span-2 grid grid-cols-1 gap-1 text-xs"><div>Firmenadresse <span className="text-white/50">(optional, für dein Angebot)</span></div><input name="adresse" type="text" autoComplete="street-address" placeholder="Straße, PLZ, Ort"/></label>
    <label className="grid grid-cols-1 gap-1 text-xs">E-Mail *<input name="email" required type="email" autoComplete="email"/></label>
    <label className="grid grid-cols-1 gap-1 text-xs">Telefon *<input name="tel" required type="tel" autoComplete="tel"/></label>
    <label className="sm:col-span-2 grid grid-cols-1 gap-1 text-xs"><div>Weitere Informationen <span className="text-white/50">(optional)</span></div><textarea name="notes" rows="4" placeholder="z. B. Wunschtermin, Pantone-Farben, Druck seitlich am Ärmel …" className="w-full rounded-2xl border border-white/30 bg-transparent p-3 text-sm text-white placeholder:text-white/40"/></label></div>
   <div className="text-[11px] text-white/60">* Pflichtfelder</div>
   <div className="text-xs text-white/70">Fragen? Schreib uns an <a href={"mailto:"+MAIL} className="underline text-[var(--ac)]">{MAIL}</a></div>
   <button disabled={!cartItems.length} className={"rounded-full bg-[var(--ac)] py-3 font-bold text-sm "+(!cartItems.length?'opacity-50':'')}>Anfrage absenden</button></form></div>}
 {sent&&<Thanks sent={sent} onNew={resetAll}/>}
 {toast&&<div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-white text-[#1f2749] text-sm font-semibold rounded-full px-4 py-2 shadow-lg">{toast}</div>}
 </div>);
}
{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),8000);fetch(IMG_BASE+'manifest.json',{signal:ac.signal}).then(r=>r.json()).then(j=>{OWD=j.models||{}}).catch(e=>console.warn('Bilder-Manifest nicht geladen',e)).finally(()=>{clearTimeout(tm);ReactDOM.createRoot(document.getElementById('root')).render(<App/>)})}
</script>
</body>
</html>
